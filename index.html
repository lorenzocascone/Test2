<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no + maximum-scale stop pinch/double-tap zoom from
       fighting the touch controls; viewport-fit=cover fills notched phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Corsair — A Top-Down Sailing Game</title>
  <!-- Content Security Policy: scripts only from this origin, styles/fonts
       only from here + Google Fonts, no plugins/frames/forms/connections.
       GitHub Pages can't set HTTP headers, so the meta tag is the vehicle.
       Defense-in-depth: even if an injection bug appeared, foreign script
       could not load and data could not be exfiltrated via fetch. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; base-uri 'none'; form-action 'none'" />
  <!-- Pirate display font for titles & the chart; falls back gracefully -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- The game world is rendered entirely onto this canvas.
       It is resized by JS to always fill the viewport. -->
  <canvas id="game-canvas"></canvas>

  <!-- HTML overlay for UI. Kept outside the canvas so we get crisp text,
       easy layout, and no per-frame redraw cost for static elements. -->
  <div id="ui-overlay">

    <!-- Title card: fades in on load, lingers, fades away. Pure CSS. -->
    <div id="title-card">
      <h1>&#9875; Corsair</h1>
      <p>trade &middot; plunder &middot; sail the open sea</p>
    </div>

    <!-- Top-left: player resources -->
    <div id="stats-panel" class="panel">
      <div class="stat">
        <span class="stat-label">Gold</span>
        <span class="stat-value" id="stat-gold">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Crew</span>
        <span class="stat-value" id="stat-crew">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Food</span>
        <span class="stat-value" id="stat-food">0</span>
      </div>
    </div>

    <!-- Top-right: wind information. The arrow rotates via CSS transform
         to point in the direction the wind is blowing TOWARD. -->
    <div id="wind-panel" class="panel">
      <div id="wind-compass">
        <div id="wind-arrow">&#10148;</div>
      </div>
      <div class="stat">
        <span class="stat-label">Wind</span>
        <span class="stat-value" id="stat-wind-speed">0 kn</span>
      </div>
      <div class="stat">
        <span class="stat-label">From</span>
        <span class="stat-value" id="stat-wind-dir">N</span>
      </div>
    </div>

    <!-- Map toggle button, tucked under the wind panel -->
    <button id="map-toggle">&#128506; Chart <kbd>M</kbd></button>

    <!-- Bottom-center: ship status (speed + sail trim + cargo) -->
    <div id="ship-panel" class="panel">
      <div class="stat">
        <span class="stat-label">Speed</span>
        <span class="stat-value" id="stat-ship-speed">0 kn</span>
      </div>
      <div class="stat">
        <span class="stat-label">Sails</span>
        <span class="stat-value" id="stat-sails">Furled</span>
      </div>
      <div class="stat">
        <span class="stat-label">Cargo</span>
        <span class="stat-value" id="stat-cargo">0/0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Hull</span>
        <span class="stat-value" id="stat-hull">100</span>
      </div>
      <div id="controls-hint">
        W/&#8593; sails up &middot; S/&#8595; sails down &middot; A/D steer &middot; Space fire &middot; E dock &middot; M chart
      </div>
    </div>

    <!-- On-screen touch controls for mobile. Hidden on mouse/keyboard
         devices via CSS (@media pointer: coarse). Each button carries a
         data-action matching the engine's logical input names, so touch
         and keyboard drive exactly the same input state. -->
    <div id="touch-controls">
      <!-- Left thumb: steering -->
      <div class="touch-cluster" id="touch-steer">
        <button class="touch-btn" data-action="left" aria-label="Steer left">&#10094;</button>
        <button class="touch-btn" data-action="right" aria-label="Steer right">&#10095;</button>
      </div>
      <!-- Right thumb, upper: broadside! -->
      <div class="touch-cluster" id="touch-fire">
        <button class="touch-btn touch-btn-fire" data-action="fire" aria-label="Fire broadside">
          <span class="touch-btn-glyph">&#128165;</span>
          <span class="touch-btn-label">Fire</span>
        </button>
      </div>
      <!-- Right thumb: sail trim -->
      <div class="touch-cluster" id="touch-sails">
        <button class="touch-btn" data-action="up" aria-label="Raise sails">
          <span class="touch-btn-glyph">&#9650;</span>
          <span class="touch-btn-label">Sail</span>
        </button>
        <button class="touch-btn" data-action="down" aria-label="Lower sails">
          <span class="touch-btn-glyph">&#9660;</span>
          <span class="touch-btn-label">Sail</span>
        </button>
      </div>
    </div>

    <!-- ==================================================================
         Pirate map — an unfurlable parchment scroll showing the whole
         world and the player's live position. CSS animates the unfurl
         (scaleY on the scroll); map.js draws the chart onto the canvas.
         ================================================================== -->
    <div id="pirate-map" class="hidden">
      <div id="pirate-map-scroll">
        <div class="scroll-rod scroll-rod-top"></div>
        <canvas id="map-canvas" width="520" height="520"></canvas>
        <div class="scroll-rod scroll-rod-bottom"></div>
      </div>
    </div>

    <!-- Dock prompt: appears when the ship drifts within docking range of
         a port. It's a real button so tapping it works on mobile; on
         desktop the E key does the same thing. -->
    <button id="dock-prompt" class="hidden">
      &#9875; Dock at <span id="dock-port-name"></span> <kbd>E</kbd>
    </button>

    <!-- ==================================================================
         Port menu — modal overlay shown while docked. The engine pauses
         its physics loop while this is open; closing it resumes sailing.
         ================================================================== -->
    <div id="port-menu" class="hidden">
      <div id="port-menu-panel">

        <div id="port-menu-header">
          <div>
            <h2 id="port-name">Port</h2>
            <span id="port-faction">Faction</span>
          </div>
          <button id="port-close" aria-label="Leave port">&#10005;</button>
        </div>

        <!-- Tab strip -->
        <div id="port-tabs">
          <button class="port-tab active" data-tab="tavern">Tavern</button>
          <button class="port-tab" data-tab="market">Market</button>
        </div>

        <!-- Tavern: recruiting, repairs and rumors -->
        <div id="tab-tavern" class="tab-pane active">
          <p id="tavern-flavor" class="flavor-text"></p>
          <div class="tavern-actions">
            <button id="btn-recruit">Recruit a sailor &mdash; 25g</button>
            <button id="btn-recruit5">Buy a round (+5 crew) &mdash; 110g</button>
            <button id="btn-repair">Careen &amp; repair hull &mdash; 40g</button>
            <button id="btn-rumor">Buy a rumor &mdash; 15g</button>
          </div>
          <p id="rumor-box" class="flavor-text"></p>
        </div>

        <!-- Market: buy/sell cargo. Rows are generated by portMenu.js -->
        <div id="tab-market" class="tab-pane">
          <div id="market-rows"></div>
        </div>

        <!-- Footer mirrors the HUD so trades show their effect instantly -->
        <div id="port-menu-footer">
          <span>Gold <b id="menu-gold">0</b></span>
          <span>Crew <b id="menu-crew">0</b></span>
          <span>Cargo <b id="menu-cargo">0/0</b></span>
        </div>
        <p id="menu-status"></p>

      </div>
    </div>

    <!-- Red vignette flash when the player's hull takes a hit -->
    <div id="damage-flash"></div>

    <!-- ==================================================================
         Game Over — shown when the player's hull reaches zero.
         ================================================================== -->
    <div id="game-over" class="hidden">
      <div id="game-over-panel">
        <h2>Davy Jones Claims Ye</h2>
        <p id="game-over-stats"></p>
        <button id="btn-restart">Sail Again</button>
      </div>
    </div>

  </div>

  <!-- type="module" enables ES6 import/export across our src files -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
